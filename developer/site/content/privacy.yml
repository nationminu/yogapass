# 개인정보 처리방침 본문 (SCR-006) — 기술 설계 §6.2 (pages/privacy.html 이 이 파일을 직접 읽는다)
#
# 규칙
#  · **목차 구조(11항목)는 제작이 정의**하고 **본문 문안은 고객이 확정**한다. 법률 판단은 하지 않는다
#    (화면정의서 SCR-006 · REQ-F-050).
#  · 고객 확정 전인 항목은 status: pending 으로 두고 본문에 [TBD: 고객 확인 필요 — T-F] 를 남긴다.
#    → REQ-F-050 1차 수용 기준("미확정 항목은 [TBD]로 보인다")이 요구하는 표시다.
#  · status: pending 이 하나라도 남으면 **배포 사전 점검(`manage.py check_release`)이 종료 코드 1 로 막는다**
#    (manage.py check_release — REQ-N-023 ① 오픈 판정 기준).
#  · 문안을 확정하면 해당 항목의 status 를 confirmed 로 바꾸고 [TBD] 문자열을 지운다.
#
# 블록 타입: p(문단) / ul(목록) / table(표 — <768px 에서 카드로 전환)

effective_date: null          # [TBD: 고객 확인 필요 — T-F] 시행일 (예: 2026-11-06)
version: null                 # [TBD] 문서 버전

sections:
  - id: p1
    title: 총칙·적용 범위
    status: pending
    body:
      - type: p
        text: "[TBD: 고객 확인 필요 — T-F] 본 방침은 상호(T-G 확정 대기)가 운영하는 웹사이트(도메인 T-A 확정 대기)에 적용됩니다."

  - id: p2
    title: 수집하는 개인정보 항목과 수집 방법
    status: pending
    body:
      - type: p
        text: "1차 공개 범위에서 수집하는 항목입니다. 표의 항목은 데이터베이스가 실제로 저장하는 항목과 양방향으로 일치합니다(REQ-N-020)."
      - type: table
        columns: ["구분", "수집 항목", "수집 방법", "근거"]
        rows:
          - ["문의 폼", "이름, 휴대폰 번호, 문의 내용", "이용자 직접 입력", "정보주체 동의"]
          - ["자동 수집", "접속 로그, 출처 IP 의 해시값(원본 IP 미저장)", "서비스 이용 과정에서 자동 생성", "[TBD: 고객 확인 필요 — T-F]"]
      - type: p
        text: "[TBD: 고객 확인 필요 — T-F] 위 표 외에 수집하는 항목이 있는지 확인이 필요합니다."

  - id: p3
    title: 수집·이용 목적
    status: pending
    body:
      - type: ul
        items:
          - "문의 접수 및 답변"
          - "[TBD: 고객 확인 필요 — T-F] 그 밖의 이용 목적"

  - id: p4
    title: 보유·이용 기간과 파기 절차·방법
    status: pending
    body:
      - type: p
        text: "아래 보관 기간은 확정 전 잠정값이며, 기간이 지난 자료는 정기 작업으로 자동 파기됩니다."
      - type: table
        columns: ["항목", "보관 기간", "파기 방법"]
        rows:
          - ["문의 내용(이름·휴대폰 번호·문의 내용)", "[TBD: 고객 확인 필요 — T-F] (잠정 1년)", "기간 경과 시 자동 파기(정기 작업)"]
          - ["접속 로그", "[TBD: 고객 확인 필요 — T-F]", "기간 경과 시 자동 파기(정기 작업)"]

  - id: p5
    title: 제3자 제공
    status: pending
    body:
      - type: p
        text: "[TBD: 고객 확인 필요 — T-F] 제3자 제공 여부를 확정해 주세요. 제공하지 않는 경우 \"제공하지 않습니다\"로 확정합니다."

  - id: p6
    title: 개인정보 처리 위탁
    status: pending
    body:
      - type: p
        text: "실제로 사용하는 외부 서비스만 적습니다. 아래 목록은 기술 설계 §7.1 에서 확정한 것이며 사업자명은 고객 확정 대상입니다(REQ-F-052)."
      - type: table
        columns: ["수탁자", "위탁 업무", "처리하는 개인정보", "국외 이전"]
        rows:
          - ["[TBD: 고객 확인 필요 — 메일 발송 사업자]", "문의 접수 알림 메일 발송", "수신자 주소, 본문에 포함된 이름·연락처", "[TBD]"]
          - ["[TBD: 고객 확인 필요 — 지도 서비스]", "오시는 길 지도 표시·길찾기", "없음(지도를 불러오기 전에는 요청이 발생하지 않습니다)", "[TBD]"]
          - ["[TBD: 고객 확인 필요 — 분석 도구]", "방문·전환 측정", "페이지 경로·기기 정보(식별 정보 제외)", "[TBD]"]
      - type: p
        text: "문의 내용을 비롯한 그 밖의 자료는 외부에 위탁하지 않고 자체 서버에만 보관합니다."

  - id: p7
    title: 정보주체의 권리와 행사 방법
    status: pending
    body:
      - type: p
        text: "[TBD: 고객 확인 필요 — T-E·T-F] 열람·정정·삭제·처리정지 요청 창구(전화·이메일)를 확정해 주세요."

  - id: p8
    title: 만 14세 미만 아동의 개인정보 처리
    status: pending
    body:
      - type: p
        text: "[TBD: 고객 확인 필요 — T-F] 만 14세 미만 아동에 대한 처리 방침을 확정해 주세요."

  - id: p9
    title: 개인정보 보호책임자
    status: pending
    body:
      - type: p
        text: "[TBD: 고객 확인 필요 — T-F] 보호책임자의 이름·직책·연락처를 확정해 주세요."

  - id: p10
    title: 안전성 확보 조치
    status: pending
    body:
      - type: p
        text: "아래는 이 사이트에 실제로 적용한 조치입니다."
      - type: ul
        items:
          - "전 구간 HTTPS 통신"
          - "비밀번호는 복원할 수 없는 해시로 저장"
          - "접근 권한 최소화(기본값 거부) 및 관리자 작업 기록"
          - "출처 IP 는 원본을 저장하지 않고 해시값만 보관"
          - "보관 기간이 지난 자료의 자동 파기"
      - type: p
        text: "[TBD: 고객 확인 필요 — T-F] 물리적·관리적 조치(문서 보관, 교육 등) 기재 여부를 확정해 주세요."

  - id: p11
    title: 시행일·개정 이력
    status: pending
    body:
      - type: table
        columns: ["버전", "시행일", "변경 내용"]
        rows:
          - ["[TBD]", "[TBD: 고객 확인 필요 — T-F]", "최초 제정"]
