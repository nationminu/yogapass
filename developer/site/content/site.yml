# 사이트 표시 값 (단일 원본) — 기술 설계 §5.1.1
# 사용법: 값을 고친 뒤 반드시 `manage.py seed_content` 를 1회 실행해야 화면에 반영된다.
# 규칙: 확인되지 않은 값은 value 를 비우고 is_published: false 로 둔다.
#       미확정 항목은 화면에서 해당 요소·행 자체를 렌더하지 않는다(REQ-N-023).
