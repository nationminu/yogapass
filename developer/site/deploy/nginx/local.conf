# 로컬 proxy 프로필 전용 nginx 설정 (기술 설계 §3.2.1 · §12.3)
# 기존 운영 nginx 에 요청할 지시어 집합과 **같은 것**을 로컬에서 먼저 검증한다.
server {
    listen 80;
    server_name localhost;

    # (1) 실제 404 를 그대로 통과시킨다 — REQ-F-060
    proxy_intercept_errors off;

    # (2) HTML 압축 주체는 nginx 다 (기술 설계 §12.3 #4)
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # (3) 별도 로그 파일
    access_log /var/log/nginx/yogapass.access.log;
    error_log  /var/log/nginx/yogapass.error.log;

    client_max_body_size 2m;

    # (4) 스테이징 접근 제어 선검증 (devops R2 #4)
    #     아래 2줄의 주석을 풀면 무인증 401 -> 인증 후 200 을 로컬에서 확인할 수 있다.
    #     htpasswd.dummy 는 **검증 전용 더미**이며 운영·스테이징 계정과 무관하다.
    # auth_basic "yogapass staging";
    # auth_basic_user_file /etc/nginx/htpasswd.dummy;

    # ⚠ 컨테이너는 재생성될 때 IP 가 바뀐다. 호스트명을 그대로 쓰면 nginx 가 기동 시 1회만
    #    해석해 app 재생성 후 502 가 남는다 → **변수 + resolver** 로 매번 다시 해석한다.
    #    (운영 샘플은 127.0.0.1:PORT 고정이라 이 문제가 없다)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app app;

    location / {
        proxy_pass http://$upstream_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # (5) 앱이 내려가 있어도 보이는 정적 점검 화면
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
