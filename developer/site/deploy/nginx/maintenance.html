<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>잠시 점검 중입니다 · 요가패스</title>
<!-- 자립형 정적 화면 (기술 설계 §12.3 #6) — 앱·DB·외부 자산에 전혀 의존하지 않는다. -->
<style>
  :root { --ink:#16263A; --muted:#5A6B7D; --primary:#0B4F9E; --subtle:#F0F5FB; --border:#DDE4EC; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--subtle); color:var(--ink); padding:24px;
         font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
         line-height:1.7; }
  main { background:#fff; border:1px solid var(--border); border-radius:12px;
         padding:40px 24px; max-width:520px; width:100%; text-align:center; }
  h1 { font-size:22px; margin:0 0 12px; letter-spacing:-0.015em; }
  p { margin:0 0 8px; color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<main>
  <h1>잠시 점검 중입니다</h1>
  <p>서비스 점검으로 일시적으로 접속할 수 없습니다.</p>
  <p>잠시 후 다시 시도해 주세요.</p>
</main>
</body>
</html>
