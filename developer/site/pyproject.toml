[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*", "staticfiles", "backups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"tests/*.py" = ["S105", "S106"]
