{% load jsonld %}{% comment %} 구조화 데이터 (REQ-N-012) — 미확정 값은 **속성 자체를 넣지 않는다**.
   빈 값·자리표시자를 출력하지 않는다(REQ-N-023). {% endcomment %}
{% spaceless %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HealthAndBeautyBusiness",
  "name": {{ site_name|json_script_safe }},
  "url": "{{ site_base_url }}/"{% if site.address %},
  "address": { "@type": "PostalAddress", "streetAddress": {{ site.address|json_script_safe }} }{% endif %}{% if site_phone %},
  "telephone": {{ site_phone|json_script_safe }}{% endif %}{% if site.hours %},
  "openingHours": {{ site.hours|json_script_safe }}{% endif %}
}
</script>
{% endspaceless %}
